<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentIT Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff;
      color: #333;
      margin: 0;
      padding: 0;
    }

    /* Navbar */
    header {
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
    }

    nav a {
      color: #eee;
      text-decoration: none;
      margin-left: 25px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #f57c00;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .container h2 {
      text-align: center;
      color: #f57c00;
      margin-bottom: 25px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn {
      text-decoration: none;
      background: #f57c00;
      color: white;
      padding: 10px 18px;
      border-radius: 5px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #ff9800;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f57c00;
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .no-data {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    footer {
      text-align: center;
      background: #111;
      color: #ccc;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo"><i class="fa-solid fa-screwdriver-wrench"></i> RentIT Admin</div>
    <nav>
      <a href="index.html"><i class="fa fa-home"></i> Home</a>
      <a href="#" onclick="logoutAdmin()"><i class="fa fa-right-from-bracket"></i> Logout</a>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="action-bar">
      <a href="index.html" class="btn"><i class="fa fa-arrow-left"></i> Back to Home</a>
    </div>

    <h2><i class="fa fa-box"></i> Listed Products & Owner Details</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Product</th>
          <th>Category</th>
          <th>Price (₹/day)</th>
          <th>Owner Name</th>
          <th>Email</th>
          <th>Contact</th>
        </tr>
      </thead>
      <tbody id="productTableBody">
        <tr>
          <td colspan="7" class="no-data">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>
    © 2025 RentIT | Admin Dashboard
  </footer>

  <script>
    // Check login
    window.addEventListener('load', () => {
  loadDashboardData();
});


    async function loadDashboardData() {
      try {
        const res = await fetch('http://localhost:3000/admin/dashboard', {
  credentials: 'include'   // important for session cookies
});

        const data = await res.json();
        const body = document.getElementById('productTableBody');

        if (!data.success || data.products.length === 0) {
          body.innerHTML = `<tr><td colspan="7" class="no-data">No products found.</td></tr>`;
          return;
        }

        body.innerHTML = data.products.map((p, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${p.product}</td>
            <td>${p.category}</td>
            <td>₹${p.price}</td>
            <td>${p.ownerName}</td>
            <td>${p.email}</td>
            <td>${p.contact}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading dashboard data:', err);
        document.getElementById('productTableBody').innerHTML = `<tr><td colspan="7" class="no-data">Failed to load data from server.</td></tr>`;
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('adminEmail');
      alert('Logged out successfully.');
      window.location.href = 'admin_login.html';
    }
  </script>

</body>
</html>
