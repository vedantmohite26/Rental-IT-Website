<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - RentIT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
    a { text-decoration: none; }
    header { background-color: #222; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    header h1 { margin: 0; font-size: 1.8rem; font-weight: bold; letter-spacing: 1px; }
    nav a { color: white; margin-left: 20px; position: relative; }
    nav a::after { content: ''; position: absolute; width: 0; height: 2px; background: #ff6600; left: 0; bottom: -4px; transition: 0.3s; }
    nav a:hover::after { width: 100%; }
    .container { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 40px 20px; }
    .card { background: white; width: 100%; max-width: 460px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; animation: fadeIn 0.6s ease-out; }
    .card h2 { margin: 0 0 6px; }
    .subtitle { margin: 0 0 18px; color: #666; font-size: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: box-shadow 0.2s, border-color 0.2s; background: #fff; }
    input[type="email"]:focus { border-color: #ff6600; box-shadow: 0 0 0 3px rgba(255,102,0,0.15); }
    .btn { width: 100%; padding: 12px 16px; background: #ff6600; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s ease; margin-top: 6px; }
    .btn:hover { background: #e05500; }
    .link { color: #ff6600; }
    footer { background: #222; color: white; text-align: center; padding: 15px; }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
  </style>
<link rel="stylesheet" href="site-shell.css">
</head>
<body>

  <header>
    <a class="site-brand" href="index.html" aria-label="RentIT home">
      <span class="site-brand-mark"><i class="fa-solid fa-cube" aria-hidden="true"></i></span>
      <span>RentIT</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      
    </nav>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="forgot-title">
      <h2 id="forgot-title">Reset your password</h2>
      <p class="subtitle">Enter your account email and we'll send reset instructions</p>
      <form onsubmit="event.preventDefault(); alert('Reset link sent (demo)');">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <button class="btn" type="submit">Send reset link</button>
      </form>
      <p class="subtitle" style="margin-top:12px;">
        Remembered your password? <a class="link" href="login.html">Back to login</a>
      </p>
    </section>
  </main>

  <footer>
    <p class="site-footer-copy">© 2025 RentIT. All rights reserved.</p>
  </footer>

</body>
</html>
