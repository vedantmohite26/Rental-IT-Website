<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supplier Login - RentIT</title>

  <!-- FontAwesome & Unified Stylesheet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="supplier.css">
  <style>
    .auth-canvas {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      background: radial-gradient(circle at top, rgba(255, 102, 0, 0.08) 0%, transparent 60%), var(--bg-canvas);
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
    }
    .back-home-btn {
      position: fixed;
      top: 16px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      padding: 7px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: color 0.18s, box-shadow 0.18s, background 0.18s;
      z-index: 100;
    }
    .back-home-btn:hover {
      color: #ff6600;
      background: #fff7ed;
      border-color: #fed7aa;
      box-shadow: var(--shadow-md);
    }
    .sup-brand .sup-brand-text {
      color: #222222;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body style="background-color: var(--bg-canvas);">

  <!-- Back to Home — top left -->
  <a href="index.html" class="back-home-btn">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="auth-canvas">

    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" class="sup-brand" style="justify-content: center; margin-bottom: 8px;">
        <div class="sup-brand-logo"><i class="fa-solid fa-cube"></i></div>
        <span class="sup-brand-text">RentIT</span>
      </a>
      <span class="sup-badge sup-badge-teal">
        <i class="fa-solid fa-shield-halved"></i> Supplier Portal
      </span>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; letter-spacing: -0.02em;">
          Sign in to your account
        </h1>

      </div>

      <!-- Alert Message Box -->
      <div id="alertBox" style="display: none; padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 0.85rem; font-weight: 600;">
      </div>

      <form id="ownerLoginForm" novalidate>

        <div class="sup-form-group">
          <label class="sup-form-label" for="ownerEmail">
            Email Address <span class="required">*</span>
          </label>
          <div style="position: relative;">
            <input type="email" id="ownerEmail" class="sup-form-input" placeholder="e.g. supplier@domain.com" required style="padding-left: 36px;">
            <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.9rem;"></i>
          </div>
        </div>

        <div class="sup-form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="sup-form-label" for="ownerPassword" style="margin-bottom: 0;">
              Password <span class="required">*</span>
            </label>
          </div>
          <div style="position: relative;">
            <input type="password" id="ownerPassword" class="sup-form-input" placeholder="Enter your password" required style="padding-left: 36px; padding-right: 36px;">
            <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.9rem;"></i>
            <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;">
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="sup-btn sup-btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 0.95rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
        </button>

      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        Don't have a supplier account yet?
        <a href="owner_reg.html" style="color: #ff6600; font-weight: 700; text-decoration: none; margin-left: 4px;">
          Register here
        </a>
      </div>
    </div>



  </div>

  <script>
    const API_BASE_URL = `${window.location.protocol}//${window.location.hostname}:3001`;

    function togglePasswordVisibility() {
      const input = document.getElementById('ownerPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function showAlert(message, isError = true) {
      const box = document.getElementById('alertBox');
      box.style.display = 'block';
      box.style.background = isError ? 'var(--danger-bg)' : 'var(--success-bg)';
      box.style.color = isError ? 'var(--danger-text)' : 'var(--success-text)';
      box.style.border = `1px solid ${isError ? 'var(--danger-border)' : 'var(--success-border)'}`;
      box.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${message}`;
    }

    document.getElementById('ownerLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('ownerEmail').value.trim();
      const password = document.getElementById('ownerPassword').value.trim();

      if (!email || !password) {
        showAlert('Please enter both your email address and password.');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

      try {
        const res = await fetch(`${API_BASE_URL}/owner-login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await res.json();

        if (res.ok) {
          showAlert('Login successful! Redirecting to dashboard...', false);
          localStorage.setItem('rentitOwnerLoggedIn', 'true');
          if (result.owner) {
            localStorage.setItem('rentitCurrentOwner', JSON.stringify(result.owner));
          }
          setTimeout(() => {
            window.location.href = 'owner_dash.html';
          }, 500);
        } else {
          showAlert(result.message || 'Invalid email or password. Please try again.');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal';
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Could not connect to the authentication server. Please ensure the backend is running.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal';
      }
    });
  </script>

</body>
</html>
