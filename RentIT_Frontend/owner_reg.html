<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Registration - RentIT</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; color: #333; }
    a { text-decoration: none; }
    header { background-color: #222; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.8rem; cursor: pointer; }
    nav a { color: white; margin-left: 20px; }
    .container { display: grid; place-items: center; min-height: 90vh; padding: 20px; }
    .card { background: white; width: 100%; max-width: 600px; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h2 { border-left: 5px solid #ff6600; padding-left: 10px; font-size: 1.4rem; margin-bottom: 16px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    input:focus, textarea:focus { border-color: #ff6600; box-shadow: 0 0 0 3px rgba(255,102,0,0.15); }
    .otp-inputs { display: flex; gap: 10px; margin: 10px 0; }
    .otp-inputs input { width: 40px; height: 40px; text-align: center; font-size: 18px; }
    .btn { width: 100%; padding: 12px; background: #ff6600; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: #e05500; }
    footer { background: #222; color: white; text-align: center; padding: 15px; margin-top: 20px; }
  </style>
</head>
<body>

<header>
  <h1 onclick="window.location.href='index.html'">RentIT</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <h2>Owner Registration</h2>
    <form id="ownerRegistrationForm">
      <!-- Personal Details -->
      <div class="field">
        <label for="owner-name">Full Name</label>
        <input type="text" id="owner-name" name="name" required>
      </div>
      <div class="field">
        <label for="owner-email">Email</label>
        <input type="email" id="owner-email" name="email" required>
      </div>
      <div class="field">
        <label for="owner-phone">Phone Number</label>
        <input type="tel" id="owner-phone" name="phone" required>
      </div>
      <div class="field">
        <label for="owner-password">Password</label>
        <input type="password" id="owner-password" name="password" required>
      </div>

      <div class="field">
        <label for="photo">Upload Photo</label>
        <input type="file" id="photo" name="profile_pic" accept=".jpg,.jpeg,.png">
      </div>

      <button type="submit" class="btn">Register</button>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 RentIT. All rights reserved.</p>
</footer>

<script>
const form = document.getElementById("ownerRegistrationForm");
form.addEventListener("submit", async function(e){
  e.preventDefault();

  const formData = new FormData();
  formData.append("name", document.getElementById("owner-name").value.trim());
  formData.append("email", document.getElementById("owner-email").value.trim());
  formData.append("phone", document.getElementById("owner-phone").value.trim());
  formData.append("password", document.getElementById("owner-password").value.trim());

  const photoFile = document.getElementById("photo").files[0];
  if (photoFile) {
    formData.append("profile_pic", photoFile);
  }

  try {
    const response = await fetch("http://localhost:3000/owner-signup", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if(response.ok){
      alert("Registration Successful! Owner ID: " + result.owner_id);
      window.location.href = "owner_login.html";
    } else {
      alert(result.message || "Error during registration");
    }

  } catch(err){
    console.error(err);
    alert("Server error! Please try again later.");
  }
});
</script>

</body>
</html>
