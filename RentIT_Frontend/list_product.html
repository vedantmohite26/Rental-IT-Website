<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>List Product - RentIT</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: url('https://wallpaper-mania.com/wp-content/uploads/2018/09/High_resolution_wallpaper_background_ID_77700448280.jpg') no-repeat center center/cover;
      min-height: 100vh;
      color: white;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.25);
      z-index: -1;
    }
    header {
      background-color: rgba(34,34,34,0.85);
      padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top:0;
    }
    header h1 { cursor: pointer; }
    main {
      max-width: 700px;
      margin: 80px auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    h2 { text-align: center; margin-bottom: 30px; }
    form { display: flex; flex-direction: column; gap: 20px; }
    label { font-weight: bold; }
    input, textarea, select {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 100%;
    }
    .inline-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #ff6600;
      border: none;
      padding: 12px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #e65c00; }
    footer {
      background: rgba(34,34,34,0.85);
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    .error-message {
      color: #ffaaaa;
      font-size: 0.9rem;
      margin-top: -10px;
    }
  </style>
</head>
<body>
<header>
  <h1 onclick="window.location.href='index.html'">RentIT</h1>
  <nav style="display:flex; gap:20px; align-items:center;">
    <span id="ownerGreeting">Hello, Owner</span>
    <a href="#" onclick="logout()" style="color:orange;text-decoration:none;">Sign Out</a>
  </nav>
</header>

<main>

  <!-- ✅ ADDED BACK BUTTON (NO LOGIC CHANGED) -->
  <button onclick="window.location.href='owner_dash.html'"
    style="background:rgba(255,255,255,0.15); border:none; padding:10px 16px; 
    border-radius:6px; color:white; cursor:pointer; margin-bottom:15px;">
    ⬅ Back
  </button>

  <h2>List a New Product</h2>
  <form id="listForm" enctype="multipart/form-data">
    <div>
      <label for="productName">Product Name</label>
      <input type="text" id="productName" required placeholder="e.g., DSLR Camera">
      <p class="error-message" id="nameError"></p>
    </div>

    <div>
      <label for="category">Category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>Electronic Gadgets</option>
        <option>Cameras</option>
        <option>Accessories</option>
        <option>Other</option>
      </select>
      <p class="error-message" id="categoryError"></p>
    </div>

    <div>
      <label for="deposit">Deposit Amount (Minimum ₹5000)</label>
      <input type="number" id="deposit" min="5000" required placeholder="e.g., 5000">
      <p class="error-message" id="depositError"></p>
    </div>

    <div>
      <label>Rental Pricing</label>
      <div class="inline-group">
        <input type="number" id="price" min="1" required placeholder="Price">
        <select id="rentUnit" required>
          <option value="">Select unit</option>
          <option value="hour">Per Hour</option>
          <option value="day" selected>Per Day</option>
          <option value="week">Per Week</option>
          <option value="month">Per Month</option>
        </select>
      </div>
      <p class="error-message" id="priceError"></p>
    </div>

    <div>
      <label for="description">Description</label>
      <textarea id="description" rows="4" required placeholder="Brief description..."></textarea>
      <p class="error-message" id="descError"></p>
    </div>

    <div>
      <label for="image">Product Image</label>
      <input type="file" id="image" accept="image/*" required>
      <p class="error-message" id="imageError"></p>
    </div>

    <div>
      <label for="bill">Upload Product Bill</label>
      <input type="file" id="bill" accept=".pdf,image/*" required>
      <small style="color:#ddd;">Accepted: PDF or image formats</small>
      <p class="error-message" id="billError"></p>
    </div>

    <button type="submit">Add Product</button>
  </form>
</main>

<footer>
  <p>&copy; 2025 RentIT. All rights reserved.</p>
</footer>

<script>
window.addEventListener('load', function() {
  const currentOwner = JSON.parse(localStorage.getItem('rentitCurrentOwner') || '{}');
  if (currentOwner.name) {
    document.getElementById('ownerGreeting').textContent = `Hello, ${currentOwner.name}`;
  }
});

function logout() {
  localStorage.removeItem('rentitOwnerLoggedIn');
  localStorage.removeItem('rentitCurrentOwner');
  alert('You have been logged out.');
  window.location.href = 'index.html';
}

document.getElementById('listForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const name = document.getElementById('productName').value.trim();
  const category = document.getElementById('category').value;
  const deposit = parseFloat(document.getElementById('deposit').value);
  const price = parseFloat(document.getElementById('price').value);
  const rentUnit = document.getElementById('rentUnit').value;
  const description = document.getElementById('description').value.trim();
  const imageFile = document.getElementById('image').files[0];
  const billFile = document.getElementById('bill').files[0];

  let valid = true;
  ['nameError','categoryError','depositError','priceError','descError','imageError','billError'].forEach(id => document.getElementById(id).textContent='');

  if(!name){ document.getElementById('nameError').textContent="Enter product name"; valid=false; }
  if(!category){ document.getElementById('categoryError').textContent="Select category"; valid=false; }
  if(!deposit || deposit<5000){ document.getElementById('depositError').textContent="Deposit must be ≥ ₹5000"; valid=false; }
  if(!price){ document.getElementById('priceError').textContent="Enter price"; valid=false; }
  if(!rentUnit){ document.getElementById('priceError').textContent="Select rental unit"; valid=false; }
  if(!description){ document.getElementById('descError').textContent="Enter description"; valid=false; }
  if(!imageFile){ document.getElementById('imageError').textContent="Upload product image"; valid=false; }
  if(!billFile){ document.getElementById('billError').textContent="Upload product bill"; valid=false; }
  if(!valid) return;

  const currentOwner = JSON.parse(localStorage.getItem('rentitCurrentOwner'));
  const formData = new FormData();
  formData.append("owner_id", currentOwner.owner_id);
  formData.append("name", name);
  formData.append("category", category);
  formData.append("deposit", deposit);
  formData.append("price", price);
  formData.append("rentUnit", rentUnit);
  formData.append("description", description);
  formData.append("image", imageFile);
  formData.append("invoice", billFile);

  try {
    const res = await fetch("http://localhost:3000/add-product", { method:"POST", body: formData });
    const result = await res.json();
    if(res.ok){
      alert("Product listed successfully!");
      window.location.href = 'manage_prod.html';
    } else alert(result.message || "Server error!");
  } catch(err) {
    console.error(err);
    alert("Server error! Try again later.");
  }
});
</script>
</body>
</html>
