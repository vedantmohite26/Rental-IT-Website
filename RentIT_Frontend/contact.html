<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Assistance | RentIT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
      color: #333;
    }
    header {
      background: #333;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      color: #ff6600;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      transition: 0.3s;
    }
    nav a:hover {
      color: #ff6600;
    }
    .contact-section {
      max-width: 900px;
      margin: 60px auto;
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1.2s ease-in-out;
    }
    .contact-section h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 2.2rem;
      color: #ff6600;
    }
    .contact-section p {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1rem;
      color: #555;
    }
    form {
      display: grid;
      gap: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 1rem;
      transition: 0.3s;
    }
    input:focus, textarea:focus {
      border-color: #ff6600;
      box-shadow: 0 0 8px rgba(255,102,0,0.5);
    }
    textarea {
      resize: none;
      min-height: 120px;
    }
    button {
      background: #ff6600;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #e65c00;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255,102,0,0.7);
    }
    .contact-info {
      margin-top: 40px;
      text-align: center;
    }
    .contact-info h3 {
      margin-bottom: 10px;
      color: #333;
    }
    .contact-info p {
      color: #555;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
<link rel="stylesheet" href="site-shell.css">
</head>
<body>
  <header>
    <a class="site-brand" href="index.html" aria-label="RentIT home">
      <span class="site-brand-mark"><i class="fa-solid fa-cube" aria-hidden="true"></i></span>
      <span>RentIT</span>
    </a>
    <nav>
      <a href="index.html">Home</a>   
    </nav>
  </header>

  <section class="contact-section">
    <h2>Contact Assistance</h2>
    <p>We’d love to hear from you! Fill in your details and our support team will respond quickly.</p>
    
    <form>
      <input type="text" placeholder="Your Full Name" required />
      <input type="email" placeholder="Your Email Address" required />
      <input type="text" placeholder="Subject" required />
      <textarea placeholder="Type your message here..." required></textarea>
      <button type="submit">Send Message</button>
    </form>

    

<div class="contact-info">
  <h3>Other ways to reach us</h3>
  <p>Email: <b>xyz123@gmail.com</b></p>
  <p>Address: Mumbai, India</p>
</div>


  </section>
</body>
</html>
