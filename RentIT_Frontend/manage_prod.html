<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Manage Products - RentIT</title>
<style>
body { font-family: 'Segoe UI', sans-serif; margin:0; 
       background:url('https://images.rawpixel.com/image_social_landscape/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTA4L3Jhd3BpeGVsb2ZmaWNlMjBfM2RfbW9kZXJuX3dhdmVfY3VydmVfYWJzdHJhY3RfaGFsZnRvbmVfZ3JhZGllbl8xZTJhY2M3Mi1jZTU3LTQ0NjItOGQzNS1lOTI4YzI5NzcxMTdfMS5qcGc.jpg') no-repeat center center/cover; 
       min-height:100vh; color:white; position:relative; }
body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25); z-index:-1; }
header { background:rgba(34,34,34,0.85); display:flex; justify-content:space-between; align-items:center; padding:10px 20px; position:sticky; top:0;}
header h1 { cursor:pointer; }
main { max-width:1100px; margin:80px auto; padding:20px;}
h2 { text-align:center; margin-bottom:30px; }
.product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;}
.product-card { background:rgba(255,255,255,0.1); padding:20px; border-radius:12px; backdrop-filter:blur(8px); box-shadow:0 2px 12px rgba(0,0,0,0.4);}
.product-card img { width:100%; border-radius:8px; max-height:180px; object-fit:cover; margin-bottom:10px;}
.product-card h3 { margin:10px 0 5px; }
.product-card p { font-size:0.9rem; margin:5px 0; }
.product-card a { color:#ffd700; text-decoration:underline; font-size:0.85rem; }
.buttons { display:flex; justify-content:space-between; margin-top:10px; }
button { background:#ff6600; border:none; padding:8px 12px; border-radius:6px; color:white; cursor:pointer; font-weight:bold; transition:0.3s; }
button:hover { background:#e65c00; }
footer { background: rgba(34,34,34,0.85); text-align:center; padding:20px; margin-top:40px;}
.edit-form { margin-top:10px; display:none; flex-direction:column; gap:8px; background: rgba(0,0,0,0.25); padding:10px; border-radius:8px;}
.edit-form input, .edit-form textarea { width:100%; padding:6px; border-radius:5px; border:none; }
.edit-form label { font-size:0.85rem; font-weight:bold; }
</style>
</head>
<body>
<header>
<h1 onclick="window.location.href='index.html'">RentIT</h1>
<nav style="display:flex; gap:20px; align-items:center;">
<span id="ownerGreeting">Hello, Owner</span>
<a href="#" onclick="logout()" style="color:orange; text-decoration:none;">Sign Out</a>
</nav>
</header>

<main>

<!-- ✅ BACK BUTTON ADDED -->
<button onclick="window.location.href='owner_dash.html'"
style="background:rgba(255,255,255,0.15); border:none; padding:10px 16px; 
border-radius:6px; color:white; cursor:pointer; margin-bottom:15px;">
⬅ Back
</button>

<h2>Manage Your Products</h2>
<div id="productContainer" class="product-grid"></div>
</main>

<footer>
<p>&copy; 2025 RentIT. All rights reserved.</p>
</footer>

<script>
window.addEventListener('load', async () => {
  const owner = JSON.parse(localStorage.getItem('rentitCurrentOwner') || '{}');
  if(owner.name) document.getElementById('ownerGreeting').textContent = `Hello, ${owner.name}`;
  loadProducts(owner.owner_id);
});

async function loadProducts(owner_id){
  try{
    const res = await fetch(`http://localhost:3000/owner-products/${owner_id}`);
    const data = await res.json();
    const container = document.getElementById('productContainer');
    container.innerHTML = '';
    if(data.products.length===0){ container.innerHTML='<p style="text-align:center;">No products listed yet.</p>'; return; }

    data.products.forEach(prod=>{
      const imageSrc = prod.image ? `http://localhost:3000/uploads/${prod.image}` : '';
      const billLink = prod.invoice ? `http://localhost:3000/uploads/${prod.invoice}` : null;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        ${imageSrc ? `<img src="${imageSrc}" alt="${prod.name}">` : ''}
        <h3>${prod.name}</h3>
        <p>Category: ${prod.category}</p>
        <p>Price: ₹<span class="price-text">${prod.price}</span> / <span class="rent-unit-text">${prod.rentUnit||'day'}</span></p>
        <p>Deposit: ₹<span class="deposit-text">${prod.deposit||0}</span></p>
        <p class="desc-text">${prod.description}</p>
        ${billLink ? `<p>Bill: <a href="${billLink}" target="_blank">View Bill</a></p>` : ''}
        <div class="buttons">
          <button onclick="toggleEdit(this)">Edit</button>
          <button onclick="deleteProduct(${prod.product_id})">Delete</button>
        </div>
        <form class="edit-form" enctype="multipart/form-data">
          <label>Name</label><input type="text" name="name" value="${prod.name}" required>
          <label>Category</label><input type="text" name="category" value="${prod.category}" required>
          <label>Price</label><input type="number" step="0.01" name="price" value="${prod.price}" required>
          <label>Rent Unit</label><input type="text" name="rentUnit" value="${prod.rentUnit||'day'}">
          <label>Deposit</label><input type="number" name="deposit" value="${prod.deposit||0}">
          <label>Description</label><textarea name="description">${prod.description||''}</textarea>
          <label>Change Image</label><input type="file" name="image">
          <label>Change Bill</label><input type="file" name="invoice">
          <button type="submit">Save Changes</button>
        </form>
      `;
      container.appendChild(card);

      const editForm = card.querySelector('.edit-form');
      editForm.addEventListener('submit', async function(e){
        e.preventDefault();
        const formData = new FormData(editForm);
        formData.append('owner_id', owner_id);
        try{
          const res = await fetch(`http://localhost:3000/update-product/${prod.product_id}`,{
            method:'PUT',
            body: formData
          });
          const result = await res.json();
          if(res.ok){ alert(result.message); loadProducts(owner_id); }
          else alert(result.message || 'Failed to update product');
        }catch(err){ console.error(err); alert('Server error!'); }
      });
    });
  }catch(err){ console.error(err); alert('Failed to load products!'); }
}

function toggleEdit(button){
  const form = button.closest('.product-card').querySelector('.edit-form');
  form.style.display = form.style.display==='flex'?'none':'flex';
}

function logout(){
  localStorage.removeItem('rentitOwnerLoggedIn');
  localStorage.removeItem('rentitCurrentOwner');
  alert('Logged out!');
  window.location.href='index.html';
}

async function deleteProduct(id){
  if(!confirm('Are you sure you want to delete this product?')) return;
  try{
    const res = await fetch(`http://localhost:3000/delete-product/${id}`,{method:'DELETE'});
    const result = await res.json();
    if(res.ok){ alert(result.message); window.location.reload(); } 
    else alert(result.message || 'Error deleting product.');
  }catch(err){ console.error(err); alert('Server error!'); }
}
</script>
</body>
</html>
