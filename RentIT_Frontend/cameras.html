<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cameras - RentIT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="storefront-nav.css">
<style>
  :root {
    --page-bg: #f8f9fa;
    --ink: #172033;
    --muted: #64748b;
    --orange: #ff6600;
    --border: #e5e7eb;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
  }

  .hero {
    min-height: 350px;
    display: flex;
    align-items: center;
    background:
      linear-gradient(90deg, rgba(10, 17, 31, 0.94) 0%, rgba(10, 17, 31, 0.78) 45%, rgba(10, 17, 31, 0.12) 100%),
      url('image/dslr.jpg') center 48% / cover no-repeat;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .hero-content {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 64px 24px;
    position: relative;
    z-index: 1;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 7px 12px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #ffe0cc;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hero h2 {
    max-width: 620px;
    margin: 0 0 12px;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    line-height: 1.08;
    letter-spacing: -0.04em;
  }

  .hero p {
    max-width: 540px;
    margin: 0;
    color: #e2e8f0;
    font-size: 1.1rem;
    line-height: 1.7;
  }

  .products-section {
    max-width: 1200px;
    margin: 34px auto 56px;
    padding: 0 20px;
  }

  .products-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(110deg, #fff 0%, #fff 78%, #fff7ed 100%);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }

  .products-info {
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 700;
  }

  .sort-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sort-label {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 700;
  }

  .sort-select {
    min-width: 190px;
    padding: 10px 34px 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    color: var(--ink);
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .sort-select:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.15);
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
  }

  .product-card {
    position: relative;
    overflow: hidden;
    padding-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: white;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    text-align: left;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .product-card:hover {
    transform: translateY(-4px);
    border-color: #fed7aa;
    box-shadow: 0 12px 26px rgba(15, 23, 42, 0.1);
  }

  .product-card img {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
    background: #f1f5f9;
  }

  .product-card h3 {
    min-height: 48px;
    margin: 16px 18px 6px;
    color: var(--ink);
    font-size: 1.08rem;
    font-weight: 750;
    line-height: 1.4;
  }

  .product-card p {
    display: -webkit-box;
    min-height: 40px;
    margin: 0 18px 8px;
    overflow: hidden;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.5;
    text-overflow: ellipsis;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .product-card > div {
    margin: 0 18px;
  }

  .product-card > div > span {
    display: inline-flex !important;
    align-items: center;
    gap: 6px;
    margin: 6px 0 !important;
    padding: 5px 10px !important;
    border-radius: 999px;
  }

  .availability-in-stock {
    border: 1px solid #bbf7d0;
  }

  .availability-out-of-stock {
    border: 1px solid #fecaca;
  }

  .product-price {
    margin: 12px 18px 8px;
    color: #c2410c;
    font-size: 1.25rem;
    font-weight: 800;
  }

  .product-card button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 4px 18px 0;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff6600, #e65c00);
    color: white;
    cursor: pointer;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(255, 102, 0, 0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .product-card button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(255, 102, 0, 0.28);
  }

  .no-products {
    grid-column: 1 / -1;
    padding: 44px 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(135deg, white 65%, #fff7ed);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    color: var(--muted);
    text-align: center;
  }

  .no-products h3 {
    margin-bottom: 8px;
    color: var(--ink);
  }

  .no-products button {
    margin-top: 15px;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff6600, #e65c00);
    color: white;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }

  footer {
    margin-top: auto;
    padding: 20px;
    background: #111827;
    color: white;
    text-align: center;
  }

  @media (max-width: 640px) {
    .hero { min-height: 300px; background-position: 60% center; }
    .hero-content { padding: 48px 22px; }
    .hero p { font-size: 1rem; }
    .products-section { margin-top: 24px; padding: 0 14px; }
    .products-controls { align-items: flex-start; flex-direction: column; padding: 16px; }
    .sort-controls { width: 100%; justify-content: space-between; }
    .sort-select { min-width: 0; flex: 1; }
    .products-grid { grid-template-columns: 1fr; gap: 16px; }
    .product-card img { height: 220px; }
  }
</style>
<link rel="stylesheet" href="category-catalog.css">
<link rel="stylesheet" href="site-shell.css">
</head>
<body class="catalog-page catalog-cameras">

<header class="store-header">
  <div class="store-header-inner">
    <a href="index.html" class="store-brand" aria-label="RentIT home">
      <span class="brand-mark"><i class="fa-solid fa-cube" aria-hidden="true"></i></span>
      <span>RentIT</span>
    </a>
    <div class="store-header-actions">
      <button class="back-btn" type="button" onclick="if (history.length > 1) history.back(); else window.location.href = 'index.html';">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back
      </button>
      <a href="cart.html" class="store-cart-link">
        <span class="store-cart-icon" aria-hidden="true">🛒</span>
        <span class="store-cart-count">0</span>
        <span class="store-cart-text">Cart</span>
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    
    <h2>Rent Professional Cameras</h2>
    <p>DSLRs, lenses, and photography gear for your next event.</p>
  </div>
</section>

<section class="products-section">
  <div class="products-controls">
    <div class="products-info" id="productsInfo">Cameras & Photography Equipment</div>
    <div class="sort-controls">
      <label class="sort-label" for="sortSelect">Sort by:</label>
      <select class="sort-select" id="sortSelect" onchange="sortProducts()">
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
        <option value="deposit-asc">Deposit (Low to High)</option>
        <option value="deposit-desc">Deposit (High to Low)</option>
      </select>
    </div>
  </div>

  <div class="products-grid" id="productsGrid"></div>
</section>

<footer>
  <p class="site-footer-copy">© 2025 RentIT. All rights reserved.</p>
</footer>

<script>
const API_BASE_URL = `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || 'localhost'}:3001`;
let products = [];

window.addEventListener('load', async () => { await loadProducts(); });

async function loadProducts() {
  try {
    const res = await fetch(`${API_BASE_URL}/products/category/cameras`);
    const data = await res.json();
    products = data.products || [];
    displayProducts(products);
  } catch(err) {
    console.error(err);
    document.getElementById('productsGrid').innerHTML = `<div class="no-products">Failed to load products from server.</div>`;
  }
}

function displayProducts(items) {
  const grid = document.getElementById('productsGrid');
  if(items.length === 0) {
    grid.innerHTML = `<div class="no-products"><h3>No cameras available</h3><p>Be the first to list a camera for rent!</p><button onclick="window.location.href='owner_login.html'" style="margin-top:15px;">List Your Camera</button></div>`;
    return;
  }
  grid.innerHTML = items.map(p => {
    const qty = Number(p.quantity) || 0;
    const availBadge = qty > 0 
      ? `<span class="availability-in-stock" style="font-size:0.75rem; font-weight:700; background:#dcfce7; color:#15803d;"><i class="fa-solid fa-circle-check"></i> In Stock (${qty} available)</span>`
      : `<span class="availability-out-of-stock" style="font-size:0.75rem; font-weight:700; background:#fee2e2; color:#b91c1c;"><i class="fa-solid fa-circle-xmark"></i> Out of Stock</span>`;

    return `
      <div class="product-card">
        <img src="${API_BASE_URL}/uploads/${p.image}" alt="${p.name}" onerror="this.src='image/dslr.jpg'">
        <h3>${p.name}</h3>
        <p>${p.description || ''}</p>
        <div>${availBadge}</div>
        <div class="product-price">₹${p.price}/day</div>
        <p><strong>Deposit:</strong> ₹${p.deposit || 0}</p>
        <button onclick="openProduct(${p.product_id})">Rent Now</button>
      </div>
    `;
  }).join('');
}

function openProduct(id) {
  window.location.href = `product_details.html?id=${id}`;
}


function sortProducts() {
  const [field, dir] = document.getElementById('sortSelect').value.split('-');
  const sorted = [...products].sort((a,b) => {
    let valA = field==='name' ? a.name.toLowerCase() : parseFloat(a[field] || 0);
    let valB = field==='name' ? b.name.toLowerCase() : parseFloat(b[field] || 0);
    return dir==='asc' ? valA>valB?1:valA<valB?-1:0 : valA<valB?1:valA>valB?-1:0;
  });
  displayProducts(sorted);
}
</script>
<script src="storefront-nav.js"></script>

</body>
</html>
