<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - RentIT</title>

  <!-- FontAwesome & Unified Stylesheet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="supplier.css">

  <style>
    .auth-canvas {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      background: radial-gradient(circle at top, rgba(255, 102, 0, 0.08) 0%, transparent 60%), var(--bg-canvas);
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
    }

    .back-home-btn {
      position: fixed;
      top: 16px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      padding: 7px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: color 0.18s, box-shadow 0.18s, background 0.18s;
      z-index: 100;
    }

    .back-home-btn:hover {
      color: #ff6600;
      background: #fff7ed;
      border-color: #fed7aa;
      box-shadow: var(--shadow-md);
    }

    .sup-brand .sup-brand-text {
      color: #222222;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body style="background-color: var(--bg-canvas);">

  <!-- Back to Home — top left -->
  <a href="index.html" class="back-home-btn">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="auth-canvas">

    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" class="sup-brand" style="justify-content: center; margin-bottom: 8px;">
        <div class="sup-brand-logo"><i class="fa-solid fa-cube"></i></div>
        <span class="sup-brand-text">RentIT</span>
      </a>

      <span class="sup-badge sup-badge-teal">
        <i class="fa-solid fa-shield-halved"></i> Admin Portal
      </span>
    </div>

    <!-- Admin Login Card -->
    <div class="auth-card">

      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; letter-spacing: -0.02em;">
          Admin login
        </h1>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox"
           role="alert"
           aria-live="polite"
           style="display: none; padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 0.85rem; font-weight: 600;">
      </div>

      <form id="adminLoginForm" novalidate>

        <!-- Admin Username -->
        <div class="sup-form-group">
          <label class="sup-form-label" for="adminUsername">
            Username <span class="required">*</span>
          </label>

          <div style="position: relative;">
            <input
              type="text"
              id="adminUsername"
              class="sup-form-input"
              placeholder="e.g. admin"
              required
              autocomplete="username"
              style="padding-left: 36px;"
            >

            <i class="fa-solid fa-user"
               style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.9rem; pointer-events: none;">
            </i>
          </div>
        </div>

        <!-- Admin Password -->
        <div class="sup-form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="sup-form-label" for="adminPassword" style="margin-bottom: 0;">
              Password <span class="required">*</span>
            </label>
          </div>

          <div style="position: relative;">
            <input
              type="password"
              id="adminPassword"
              class="sup-form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
              style="padding-left: 36px; padding-right: 36px;"
            >

            <i class="fa-solid fa-lock"
               style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.9rem; pointer-events: none;">
            </i>

            <button
              type="button"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
              style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;"
            >
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Admin Login Button -->
        <button
          type="submit"
          id="loginBtn"
          class="sup-btn sup-btn-primary"
          style="width: 100%; padding: 12px; margin-top: 10px; font-size: 0.95rem;"
        >
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
        </button>

      </form>
    </div>
  </div>

  <script>
    // Preserve the admin backend URL and cookie behavior.
    const API_BASE_URL =
      `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || 'localhost'}:3001`;

    // Restore the existing session-expiry message.
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);

      if (urlParams.get('error') === 'session_expired') {
        showAlert(
          'Your admin session expired or was invalid. Please sign in again.'
        );
      }
    });

    // Show/hide admin password.
    document.getElementById('togglePassword').addEventListener('click', () => {
      const passwordInput = document.getElementById('adminPassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const toggleButton = document.getElementById('togglePassword');

      const isPassword = passwordInput.type === 'password';

      passwordInput.type = isPassword ? 'text' : 'password';

      eyeIcon.className = isPassword
        ? 'fa-solid fa-eye-slash'
        : 'fa-solid fa-eye';

      toggleButton.setAttribute('aria-pressed', String(isPassword));
      toggleButton.setAttribute(
        'aria-label',
        isPassword ? 'Hide password' : 'Show password'
      );
    });

    // Display alerts safely.
    function showAlert(message, isError = true) {
      const box = document.getElementById('alertBox');

      box.style.display = 'block';
      box.style.background = isError
        ? 'var(--danger-bg)'
        : 'var(--success-bg)';

      box.style.color = isError
        ? 'var(--danger-text)'
        : 'var(--success-text)';

      box.style.border = `1px solid ${
        isError ? 'var(--danger-border)' : 'var(--success-border)'
      }`;

      const icon = document.createElement('i');

      icon.className = `fa-solid ${
        isError ? 'fa-circle-exclamation' : 'fa-circle-check'
      }`;

      box.replaceChildren(icon, document.createTextNode(' ' + message));
    }

    // Admin authentication.
    document.getElementById('adminLoginForm').addEventListener(
      'submit',
      async function(e) {
        e.preventDefault();

        const username = document
          .getElementById('adminUsername')
          .value.trim();

        const password = document
          .getElementById('adminPassword')
          .value.trim();

        const loginBtn = document.getElementById('loginBtn');

        if (!username || !password) {
          showAlert('Please enter both username and password.');
          return;
        }

        loginBtn.disabled = true;

        loginBtn.innerHTML =
          '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

        try {
          const res = await fetch(`${API_BASE_URL}/admin/login`, {
            method: 'POST',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            showAlert('Login successful! Redirecting...', false);

            // Preserve the existing admin session key.
            sessionStorage.setItem('rentitAdminAuth', 'true');

            setTimeout(() => {
              window.location.href = 'admin_dash.html';
            }, 350);

          } else {
            showAlert(data.message || 'Invalid username or password.');

            loginBtn.disabled = false;

            loginBtn.innerHTML =
              '<i class="fa-solid fa-arrow-right-to-bracket"></i> Login';
          }

        } catch (err) {
          console.error('Admin login error:', err);

          showAlert(
            'Could not connect to the backend server. Make sure it is running on port 3001.'
          );

          loginBtn.disabled = false;

          loginBtn.innerHTML =
            '<i class="fa-solid fa-arrow-right-to-bracket"></i> Login';
        }
      }
    );
  </script>

</body>
</html>
