<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment - RentIT</title>

<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#f8f9fa;}
header,footer{background-color:#222;color:white;padding:15px 20px;text-align:center;}
.container{padding:30px;max-width:600px;margin:auto;background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.1);}
h2{text-align:center;margin-bottom:30px;}
label{display:block;margin-bottom:6px;font-weight:bold;}
input,textarea{width:100%;padding:10px;margin-bottom:20px;border-radius:5px;border:1px solid #ccc;font-size:1rem;}
button{border:none;padding:12px 25px;border-radius:5px;font-size:1rem;font-weight:bold;cursor:pointer;width:100%;}
.place-btn{background:#ff6600;color:white;}
.place-btn:hover{background:#e65c00;}
.cancel-btn{background:#888;color:white;margin-top:10px;}
.cancel-btn:hover{background:#666;}
.amount-box{text-align:center;font-size:18px;font-weight:bold;margin-bottom:15px;color:#333;}
</style>
</head>
<body>

<header><h1>RentIT - Payment</h1></header>

<div class="container">
<h2>Complete Your Order</h2>

<form id="paymentForm">

<p id="amountBox" class="amount-box"></p>

<label for="fullName">Full Name</label>
<input type="text" id="fullName" required/>

<label for="phoneNumber">Phone Number</label>
<input type="tel" id="phoneNumber" pattern="[0-9]{10}" placeholder="Enter 10-digit number" required/>

<label for="address">Delivery Address</label>
<textarea id="address" rows="3" required></textarea>

<button type="submit" class="place-btn">Pay Now</button>
<button type="button" class="cancel-btn" onclick="cancelOrder()">Cancel Order</button>

</form>
</div>

<footer><p>&copy; 2025 RentIT. All rights reserved.</p></footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
const API_BASE_URL = `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || 'localhost'}:3001`;
let cartStorageKey = null;

// ✅ Show Total Amount
document.addEventListener("DOMContentLoaded", async () => {
  let sessionResponse;
  try {
    sessionResponse = await fetch(`${API_BASE_URL}/user-session`, {
      credentials: "include"
    });
  } catch (error) {
    console.error("Payment session check failed:", error);
    alert("Could not verify your login. Please try again.");
    return;
  }

  if (sessionResponse.status === 401) {
    window.location.href = "login.html?returnTo=cart.html";
    return;
  }

  if (!sessionResponse.ok) {
    alert("Could not verify your login. Please try again.");
    return;
  }

  const { user } = await sessionResponse.json();
  cartStorageKey = `rentitCart_${user.user_id}`;
  let cart = JSON.parse(localStorage.getItem(cartStorageKey)) || [];
  if (cart.length === 0) {
    window.location.href = "cart.html";
    return;
  }

  let totalRent = 0;
  let totalDeposit = 0;

  cart.forEach(item => {
    const duration = parseInt(item.duration) || 1;
    const rent = parseFloat(item.price) * duration;
    const deposit = parseFloat(item.deposit) || 0;

    totalRent += rent;
    totalDeposit += deposit;
  });

  let totalAmount = totalRent + totalDeposit;

  document.getElementById("amountBox").innerText = `Total Payable Amount: ₹${totalAmount}`;
  localStorage.setItem("totalAmount", totalAmount);
});

document.getElementById('paymentForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  let cart = JSON.parse(localStorage.getItem(cartStorageKey)) || [];
  let totalAmount = parseFloat(localStorage.getItem("totalAmount")) || 0;

  if(cart.length === 0){
    alert("Your cart is empty!");
    window.location.href = "cart.html";
    return;
  }

  if (totalAmount < 1){
    alert("Invalid amount detected!");
    return;
  }

  // ✅ Create Razorpay Order (Amount in paise)
  const response = await fetch(`${API_BASE_URL}/create-order`, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount: Math.round(totalAmount * 100) })
  });

  const orderData = await response.json();

  var options = {
    "key": "rzp_test_RZjNJBX2w3wscx",
    "amount": orderData.amount.toString(),
    "currency": "INR",
    "name": "RentIT Rentals",
    "description": "Payment for rental items",
    "order_id": orderData.id,
    "handler": async function (response) {

      await fetch(`${API_BASE_URL}/save-order`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          items: cart,
          address: document.getElementById("address").value,
          total_amount: totalAmount,
          payment_id: response.razorpay_payment_id
        })
      });

      localStorage.removeItem(cartStorageKey);
      window.location.href = "thankyou.html";
    },
    "theme": { "color": "#ff6600" }
  };

  var rzp = new Razorpay(options);
  rzp.open();
});

function cancelOrder(){
  if(confirm("Are you sure you want to cancel the order?")){
    window.location.href="cart.html";
  }
}
</script>

</body>
</html>
