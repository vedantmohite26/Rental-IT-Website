<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RentIT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
    a { text-decoration: none; }
    header { background-color: #222; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    header h1 { margin: 0; font-size: 1.8rem; font-weight: bold; letter-spacing: 1px; }
    nav a { color: white; margin-left: 20px; position: relative; }
    nav a::after { content: ''; position: absolute; width: 0; height: 2px; background: #ff6600; left: 0; bottom: -4px; transition: 0.3s; }
    nav a:hover::after { width: 100%; }
    .container { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 40px 20px; }
    .card { background: white; width: 100%; max-width: 420px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; animation: fadeIn 0.6s ease-out; }
    .card h2 { margin: 0 0 6px; }
    .subtitle { margin: 0 0 18px; color: #666; font-size: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: box-shadow 0.2s, border-color 0.2s; background: #fff; }
    input:focus { border-color: #ff6600; box-shadow: 0 0 0 3px rgba(255,102,0,0.15); }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .remember { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .link { color: #ff6600; }
    .btn { width: 100%; padding: 12px 16px; background: #ff6600; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s ease; margin-top: 14px; }
    .btn:hover { background: #e05500; }
    .login-message { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .login-message[hidden] { display: none; }
    .login-message.success { background: #ecfdf5; color: #166534; }
    .login-message.error { background: #fef2f2; color: #b91c1c; }
    footer { background: #222; color: white; text-align: center; padding: 15px; }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
  </style>
<link rel="stylesheet" href="site-shell.css">
</head>
<body>

  <header>
    <a class="site-brand" href="index.html" aria-label="RentIT home">
      <span class="site-brand-mark"><i class="fa-solid fa-cube" aria-hidden="true"></i></span>
      <span>RentIT</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      
    </nav>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title">Welcome back</h2>
      <p class="subtitle">Log in to continue renting your favorite electronics</p>
      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="actions">
          <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
          <a class="link" href="forgot.html">Forgot password?</a>
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
      <p id="loginMessage" class="login-message" role="status" aria-live="polite" hidden></p>
      <p class="subtitle" style="margin-top:12px;">New here? <a class="link" href="signup.html">Create an account</a></p>
    </section>
  </main>

  <footer>
    <p class="site-footer-copy">© 2025 RentIT. All rights reserved.</p>
  </footer>

  <script>
    const API_BASE_URL = `${window.location.protocol === 'file:' ? 'http:' : window.location.protocol}//${window.location.hostname || 'localhost'}:3001`;

    async function handleLogin(e) {
      e.preventDefault();

      const formData = new FormData(e.target);
      const email = formData.get('email');
      const password = formData.get('password');
      const message = document.getElementById('loginMessage');

      function showLoginMessage(text, isError = false) {
        message.textContent = text;
        message.className = `login-message ${isError ? 'error' : 'success'}`;
        message.setAttribute('role', isError ? 'alert' : 'status');
        message.hidden = false;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showLoginMessage(data.message || 'Login failed', true);
          return;
        }

        localStorage.setItem('rentitLoggedIn', 'true');
        localStorage.setItem('rentitCurrentUser', JSON.stringify(data.user));

        showLoginMessage('Login successful! Redirecting...', false);
        const returnTo = new URLSearchParams(window.location.search).get('returnTo');
        const destination = returnTo
          ? new URL(returnTo, window.location.href)
          : new URL('index.html', window.location.href);
        setTimeout(() => {
          window.location.href = destination.origin === window.location.origin
            ? destination.href
            : 'index.html';
        }, 600);

      } catch (err) {
        console.error(err);
        showLoginMessage('Error connecting to server. Make sure your backend is running.', true);
      }
    }
  </script>

</body>
</html>
